name: Build and publish DX Studio ARM64 image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # Native ARM64 avoids very slow emulated Rust compilation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Integration unit tests
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Native frontend tests
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
      - name: Build ARM64 image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          pull: true
          no-cache-filters: runtime
          tags: dx-studio:test
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test headless API, authentication and PCM audio path
        run: bash scripts/smoke-test.sh dx-studio:test
      - name: Save ARM64 import archive
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          docker save dx-studio:test | gzip -1 > dist/dx-studio-arm64.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: dx-studio-arm64
          path: dist/dx-studio-arm64.tar.gz
          retention-days: 14
          compression-level: 0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag dx-studio:test "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
