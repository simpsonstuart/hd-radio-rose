name: Build and publish ROSE ARM64 image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # Native ARM64 avoids very slow emulated Rust compilation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Integration unit tests
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Native frontend tests
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
      - name: Build ARM64 image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: hd-radio-rose:test
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test headless API, authentication and PCM audio path
        run: bash scripts/smoke-test.sh hd-radio-rose:test
      - name: Save ARM64 import archive
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          docker save hd-radio-rose:test | gzip -1 > dist/hd-radio-rose-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: hd-radio-rose-arm64
          path: dist/hd-radio-rose-arm64.tar.gz
          retention-days: 14
          compression-level: 0
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag hd-radio-rose:test "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
